<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEPTUNUS DATABASE ADMIN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0c10;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --border: #30363d;
            --text: #c9d1d9;
            --success: #238636;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .header h1 { color: var(--accent); font-size: 1.5rem; margin: 0; }
        
        /* Statistik Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-card span { display: block; font-size: 0.8rem; color: #8b949e; }
        .stat-card b { font-size: 1.2rem; color: #ffffff; }

        /* Tabel List Token */
        .db-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .db-header {
            padding: 12px;
            background: #21262d;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .token-list { padding: 0; margin: 0; list-style: none; }
        .token-item {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .token-id { color: var(--accent); font-family: monospace; }
        .status-badge {
            background: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        /* Tombol Aksi */
        .actions { margin-top: 20px; display: grid; gap: 10px; }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button.secondary { background: #30363d; color: var(--text); }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛰 NEPTUNUS DATABASE</h1>
        <p style="font-size: 0.8rem;">System Administrator Panel</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span>TOTAL USERS</span>
            <b id="user-count">1,240</b>
        </div>
        <div class="stat-card">
            <span>TOTAL TOKENS</span>
            <b id="token-count">852</b>
        </div>
    </div>

    <div class="db-container">
        <div class="db-header">
            <span>List Token Terbaru</span>
            <span style="color: var(--accent);">View All</span>
        </div>
        <ul class="token-list">
            <li class="token-item">
                <span class="token-id">TK-99281-X</span>
                <span class="status-badge">Active</span>
            </li>
            <li class="token-item">
                <span class="token-id">TK-88210-Z</span>
                <span class="status-badge">Active</span>
            </li>
            <li class="token-item">
                <span class="token-id">TK-77102-Y</span>
                <span class="status-badge">Active</span>
            </li>
        </ul>
    </div>

    <div class="actions">
        <button onclick="Telegram.WebApp.showAlert('Fetching live data...')">Refresh Database</button>
        <button class="secondary" onclick="Telegram.WebApp.close()">Close Panel</button>
    </div>

    <script>
    const webapp = window.Telegram.WebApp;
    webapp.ready();
    webapp.expand();

    async function fetchData() {
        try {
            // Pakai domain panel lo langsung + port 2014
            const response = await fetch('http://tepmom.xyxv.me:2014/api/stats');
            
            if (!response.ok) throw new Error('Server VPS tidak merespon');
            
            const data = await response.json();

            // Update angka di Dashboard
            document.getElementById('user-count').innerText = data.totalUsers.toLocaleString();
            document.getElementById('token-count').innerText = data.totalTokens.toLocaleString();
            
            // Update List Token
            const listContainer = document.querySelector('.token-list');
            listContainer.innerHTML = ''; 

            data.listToken.forEach(token => {
                const li = document.createElement('li');
                li.className = 'token-item';
                li.innerHTML = `
                    <span class="token-id">${token.id}</span>
                    <span class="status-badge">${token.status}</span>
                `;
                listContainer.appendChild(li);
            });

            console.log('Koneksi ke Neptunus VPS Berhasil!');
        } catch (error) {
            console.error('Gagal sinkron data:', error);
            // Kalau gagal, kita kasih tanda di dashboard
            document.getElementById('user-count').innerText = "ERR";
        }
    }

    fetchData();
    setInterval(fetchData, 30000); // Update tiap 30 detik
    </script>
